# Supabase Auth calls this "Send Email" hook server-to-server with a webhook
# signature instead of a user JWT, so the gateway must not require one.
# The function verifies the signature itself (SEND_EMAIL_HOOK_SECRET).
[functions.send-signup-confirmation]
verify_jwt = false

# Razorpay (or the course site's server) calls this with an X-Razorpay-Signature, not a user JWT.
# The function checks the signature itself (BLUEPILL_WEBHOOK_SECRET).
[functions.bluepill-webhook]
verify_jwt = false
