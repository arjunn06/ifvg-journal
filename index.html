<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved theme before first paint so a light-mode visitor never sees a dark flash.
         Mirrors ThemeProvider (same storage key, same default); with scripts off the page stays dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ifvg-journal-theme');
          if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';
          var r = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
          var h = document.documentElement;
          h.setAttribute('data-theme', r);
          h.classList.add(r);
          h.style.colorScheme = r;
        } catch (e) {}
      })();
    </script>
    <title>IFVG Journal — Track every trade with patience, not dopamine</title>
    <meta name="description" content="IFVG Journal is the trading journal for the Arjun IFVG community. Track P&L, analyse ICT/iFVG setups, and review every session with the discipline of a pro." />
    <meta name="author" content="IFVG Journal" />
    <meta name="keywords" content="ifvg, arjun ifvg, trading journal, ict trading, fair value gap, inverse fvg, trading analytics, p&l tracking, prop firm journal" />

    <link rel="canonical" href="https://journal.ifvg.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://journal.ifvg.in/" />
    <meta property="og:title" content="IFVG Journal — Trade with patience, not dopamine" />
    <meta property="og:description" content="The trading journal for the Arjun IFVG community. Built for ICT / iFVG traders who want serious accountability." />
    <meta property="og:site_name" content="IFVG Journal" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://journal.ifvg.in/" />
    <meta name="twitter:title" content="IFVG Journal — Trade with patience, not dopamine" />
    <meta name="twitter:description" content="Trading journal built for ICT / iFVG traders. Track, review, refine." />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#171719" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IFVG Journal" />

      }

  </head>
